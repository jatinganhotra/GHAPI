name: DuckDB snapshot

# crawl-expansion-202607 stub: exports the crawler's Postgres tables to
# DuckDB and (optionally) publishes the result as a dated monthly GitHub
# Release asset. workflow_dispatch-only for now — wiring this to run
# periodically depends on the DB-target decision recorded in
# plans/crawl_expansion_20260704.md (parent repo, section c). Once that
# lands, restoring a `schedule:` trigger here costs nothing: GHAPI is
# public, so its Actions minutes are free, unlike the private
# SWEAgentsInTheWild repo where the equivalent workflow
# (.github/workflows/update_duckdb.yml) must stay manual-only.
on:
  workflow_dispatch:
    inputs:
      publish_monthly_snapshot:
        description: "Also publish this export as a dated GitHub Release asset (ghapi-snapshot-YYYY-MM)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write  # gh release create/upload in the last step needs this

jobs:
  export:
    runs-on: ubuntu-latest
    environment: Crawl
    timeout-minutes: 60
    env:
      INGESTOR_WRITER_URL: ${{ secrets.INGESTOR_WRITER_URL }}
      LEGACY_GHAPI_DATABASE_URL: ${{ secrets.GHAPI_DATABASE_URL }}
      DISPATCH_PUBLISH_MONTHLY: ${{ github.event.inputs.publish_monthly_snapshot }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt duckdb==1.2.2 pytz

      - name: Validate environment
        run: |
          if [ -z "${INGESTOR_WRITER_URL:-}" ] && [ -n "${LEGACY_GHAPI_DATABASE_URL:-}" ]; then
            echo "INGESTOR_WRITER_URL not set; falling back to GHAPI_DATABASE_URL"
            echo "INGESTOR_WRITER_URL=${LEGACY_GHAPI_DATABASE_URL}" >> "$GITHUB_ENV"
          fi
          if [ -z "${INGESTOR_WRITER_URL:-}${LEGACY_GHAPI_DATABASE_URL:-}" ]; then
            echo "Missing secret INGESTOR_WRITER_URL (or legacy GHAPI_DATABASE_URL)."
            echo "This workflow needs a live DB target for the crawl to write to first —"
            echo "see plans/crawl_expansion_20260704.md (parent repo) section (c) for the"
            echo "DB-target decision this is waiting on. Nothing to export yet; exiting."
            exit 1
          fi

      - name: Export DuckDB snapshot
        run: |
          set -euo pipefail
          mkdir -p snapshots
          python scripts/export_duckdb.py --output snapshots/ghapi_latest.duckdb

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghapi-duckdb-snapshot
          path: snapshots/ghapi_latest.duckdb
          retention-days: 90
          if-no-files-found: error

      - name: Publish monthly snapshot release
        if: ${{ github.event.inputs.publish_monthly_snapshot != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="ghapi-snapshot-$(date -u +%Y-%m)"
          MONTH_LABEL="$(date -u +%Y-%m)"
          DATED="snapshots/ghapi_${MONTH_LABEL}.duckdb"
          cp snapshots/ghapi_latest.duckdb "$DATED"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its asset"
            gh release delete-asset "$TAG" "$(basename "$DATED")" \
              --repo "$GITHUB_REPOSITORY" --yes || true
            gh release upload "$TAG" "$DATED" --repo "$GITHUB_REPOSITORY"
          else
            echo "Creating release $TAG"
            gh release create "$TAG" "$DATED" \
              --repo "$GITHUB_REPOSITORY" \
              --title "GHAPI monthly snapshot ${MONTH_LABEL}" \
              --notes "Automated monthly DuckDB snapshot of the GHAPI crawler's Postgres tables (all tracked agents; see ghapi_crawler/agents.py). Generated by .github/workflows/duckdb_snapshot.yml. Not a git-tracked file — fetch the asset from this release."
          fi
